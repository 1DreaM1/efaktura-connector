version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /tools/laravel-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
