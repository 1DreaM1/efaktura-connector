name: Wiki

# Publishes docs/wiki to the repository's GitHub wiki. The wiki is a separate git repository that GitHub
# creates when the first page is added in the web UI, so the source of truth stays in docs/wiki.
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs/wiki to the GitHub wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone --quiet "$wiki_url" wiki-repo 2>/dev/null; then
            echo "::error::The wiki repository does not exist yet. Create the first page in the Wiki tab, then run this workflow again."
            exit 1
          fi

          rsync -a --delete --exclude='.git' docs/wiki/ wiki-repo/

          cd wiki-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'The wiki is already up to date.'
            exit 0
          fi

          git commit --quiet -m "Sync wiki from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD
